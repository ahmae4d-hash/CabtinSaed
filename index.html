<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta id="vp-meta" name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<meta name="theme-color" content="#1e3a8a"/>
<meta name="description" content="منظومة الكابتن سعيد - إدارة الحركات المالية"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="ك.سعيد"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<link rel="icon" type="image/png" href="icon-192.png"/>
<title>منظومة الكابتن سعيد</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
<style>
:root{--bg:#f0f4f8;--surface:#fff;--surface2:#f1f5f9;--border:#94a3b8;--border-dark:#334155;--text:#0f172a;--text-muted:#475569;--accent:#f59e0b;--accent-dark:#d97706;--primary:#1e40af;--primary-light:#3b82f6;--danger:#dc2626;--success:#16a34a;--hover-row:#fef9c3;--total-bg:#1e293b;--total-text:#f59e0b;--shadow:0 4px 20px rgba(0,0,0,.08);--radius:12px;--th-bg:#e2e8f0;--header-bg:#1e3a8a;--header-text:#fff;--input-bg:#fff;--modal-bg:#fff;--grand-bg:#e8edf5;--mark-bg:#fef3c7;--stat-bg:#dbeafe;}
[data-theme="dark"]{--bg:#0a0f1e;--surface:#111827;--surface2:#1e293b;--border:#334155;--border-dark:#475569;--text:#f1f5f9;--text-muted:#94a3b8;--accent:#fbbf24;--accent-dark:#f59e0b;--primary:#3b82f6;--primary-light:#60a5fa;--danger:#ef4444;--success:#22c55e;--hover-row:#1e3a5f;--total-bg:#0f172a;--total-text:#fbbf24;--shadow:0 4px 24px rgba(0,0,0,.4);--th-bg:#1e293b;--header-bg:#0f172a;--header-text:#fbbf24;--input-bg:#1e293b;--modal-bg:#1e293b;--grand-bg:#0f172a;--mark-bg:#422006;--stat-bg:#1e3a5f;}
[data-theme="ocean"]{--bg:#e0f2fe;--surface:#f0f9ff;--surface2:#bae6fd;--border:#7dd3fc;--border-dark:#0369a1;--text:#0c4a6e;--text-muted:#0369a1;--accent:#0ea5e9;--accent-dark:#0284c7;--primary:#0284c7;--primary-light:#38bdf8;--danger:#dc2626;--success:#0d9488;--hover-row:#e0f2fe;--total-bg:#0c4a6e;--total-text:#bae6fd;--shadow:0 4px 20px rgba(14,165,233,.18);--th-bg:#bae6fd;--header-bg:#0c4a6e;--header-text:#e0f2fe;--input-bg:#f0f9ff;--modal-bg:#f0f9ff;--grand-bg:#bae6fd;--mark-bg:#e0f2fe;--stat-bg:#bae6fd;}
[data-theme="forest"]{--bg:#f0fdf4;--surface:#fff;--surface2:#dcfce7;--border:#86efac;--border-dark:#166534;--text:#14532d;--text-muted:#166534;--accent:#22c55e;--accent-dark:#16a34a;--primary:#16a34a;--primary-light:#4ade80;--danger:#dc2626;--success:#15803d;--hover-row:#dcfce7;--total-bg:#14532d;--total-text:#bbf7d0;--shadow:0 4px 20px rgba(22,163,74,.14);--th-bg:#bbf7d0;--header-bg:#14532d;--header-text:#f0fdf4;--input-bg:#fff;--modal-bg:#fff;--grand-bg:#dcfce7;--mark-bg:#d1fae5;--stat-bg:#bbf7d0;}
[data-theme="warm"]{--bg:#fffbeb;--surface:#fff;--surface2:#fef3c7;--border:#fbbf24;--border-dark:#92400e;--text:#78350f;--text-muted:#92400e;--accent:#f59e0b;--accent-dark:#d97706;--primary:#d97706;--primary-light:#fbbf24;--danger:#dc2626;--success:#16a34a;--hover-row:#fef3c7;--total-bg:#78350f;--total-text:#fef3c7;--shadow:0 4px 20px rgba(245,158,11,.18);--th-bg:#fde68a;--header-bg:#78350f;--header-text:#fffbeb;--input-bg:#fff;--modal-bg:#fff;--grand-bg:#fef3c7;--mark-bg:#fde68a;--stat-bg:#fde68a;}
*{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI",Cairo,Arial,sans-serif;transition:background-color .3s,color .3s,border-color .3s;}
body{background:var(--bg);color:var(--text);min-height:100vh;scroll-behavior:smooth;}
::-webkit-scrollbar{width:6px;height:6px;}::-webkit-scrollbar-track{background:var(--surface2);}::-webkit-scrollbar-thumb{background:var(--primary);border-radius:3px;}
#login-page{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:9999;background:linear-gradient(135deg,#0d47a1 0%,#0a0f1e 50%,#1a0533 100%);}
.stars{position:absolute;inset:0;overflow:hidden;pointer-events:none;}
.star{position:absolute;width:2px;height:2px;background:white;border-radius:50%;animation:twinkle 3s infinite;}
@keyframes twinkle{0%,100%{opacity:.3;transform:scale(1);}50%{opacity:1;transform:scale(1.5);}}
.login-card{background:rgba(255,255,255,.07);padding:40px 35px;border-radius:24px;text-align:center;width:min(370px,94vw);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.15);box-shadow:0 20px 60px rgba(0,0,0,.5);}
.app-title{color:#fbbf24;font-size:clamp(20px,5vw,28px);font-weight:900;margin-bottom:6px;letter-spacing:1px;}
.app-sub{color:#94a3b8;font-size:13px;margin-bottom:18px;}
.analog-clock{width:clamp(160px,40vw,200px);height:clamp(160px,40vw,200px);background:rgba(255,255,255,.95);border:8px solid #fbbf24;border-radius:50%;position:relative;margin:0 auto 28px;box-shadow:0 0 40px rgba(251,191,36,.4),inset 0 2px 10px rgba(0,0,0,.1);}
.clock-num{position:absolute;font-weight:900;font-size:clamp(14px,3vw,18px);color:#1e293b;}
.n12{top:8px;left:50%;transform:translateX(-50%);}
.n3{right:8px;top:50%;transform:translateY(-50%);}
.n6{bottom:8px;left:50%;transform:translateX(-50%);}
.n9{left:8px;top:50%;transform:translateY(-50%);}
.clock-dot{position:absolute;width:10px;height:10px;background:#1e293b;border-radius:50%;top:50%;left:50%;transform:translate(-50%,-50%);z-index:10;}
.hand{position:absolute;bottom:50%;left:50%;transform-origin:bottom center;border-radius:6px 6px 0 0;}
.hour{width:6px;height:50px;background:#1e293b;margin-left:-3px;}
.min{width:4px;height:68px;background:#334155;margin-left:-2px;}
.sec{width:2px;height:78px;background:#dc2626;margin-left:-1px;}
.clock-time{color:#94a3b8;font-size:13px;margin-bottom:18px;letter-spacing:2px;}
.profile-ring{width:120px;height:120px;border-radius:50%;background:linear-gradient(135deg,#fbbf24,#d97706,#fbbf24);padding:4px;margin:0 auto 14px;box-shadow:0 0 30px rgba(251,191,36,.5),0 0 60px rgba(251,191,36,.2);animation:pulse-gold 2.5s ease-in-out infinite;}
@keyframes pulse-gold{0%,100%{box-shadow:0 0 25px rgba(251,191,36,.4);}50%{box-shadow:0 0 45px rgba(251,191,36,.7),0 0 80px rgba(251,191,36,.25);}}
.profile-ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:center top;border:3px solid #0f172a;display:block;}
.clock-row{display:flex;align-items:center;justify-content:center;gap:16px;margin:14px 0 16px;}
.header-avatar{width:36px;height:36px;border-radius:50%;border:2px solid #fbbf24;object-fit:cover;object-position:center top;flex-shrink:0;}
#welcome-lottie{width:100%;max-width:320px;height:90px;margin:0 auto 12px;display:block;}
#passInput{width:100%;padding:14px;border-radius:10px;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff;text-align:center;font-size:18px;outline:none;letter-spacing:4px;}
#passInput::placeholder{color:rgba(255,255,255,.4);letter-spacing:1px;}
#passInput:focus{border-color:#fbbf24;box-shadow:0 0 0 3px rgba(251,191,36,.2);}
.btn-login{width:100%;margin-top:14px;padding:14px;background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;border:none;border-radius:10px;font-size:17px;font-weight:900;cursor:pointer;transition:all .2s;}
.btn-login:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(245,158,11,.4);}
.btn-login:active{transform:translateY(0);}
#main-app{display:none;}
.app-header{background:var(--header-bg);color:var(--header-text);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;position:sticky;top:0;z-index:1100;box-shadow:0 2px 20px rgba(0,0,0,.3);}
.header-title{font-size:clamp(16px,4vw,22px);font-weight:900;color:#fbbf24;white-space:nowrap;}
.header-btns{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.hbtn{padding:7px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:white;cursor:pointer;font-size:13px;font-weight:700;transition:all .2s;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:4px;}
.hbtn:hover{background:rgba(255,255,255,.2);}
.hbtn.active{background:#f59e0b;color:#000;border-color:#f59e0b;}
.app-body{padding:clamp(8px,2vw,20px);max-width:1400px;margin:auto;}
.search-section{background:var(--surface);border-radius:var(--radius);padding:14px;margin-bottom:14px;border:1px solid var(--border);box-shadow:var(--shadow);}
.search-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.search-row input{flex:1;min-width:120px;padding:10px 14px;border-radius:8px;border:2px solid var(--border);background:var(--input-bg);color:var(--text);font-size:14px;font-weight:600;outline:none;}
.search-row input:focus{border-color:var(--primary);}
.btn{padding:10px 16px;border-radius:8px;border:none;cursor:pointer;font-size:14px;font-weight:900;transition:all .2s;white-space:nowrap;color:white;}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px);}
.btn:active{transform:translateY(0);}
.btn-green{background:linear-gradient(135deg,#16a34a,#15803d);}
.btn-blue{background:linear-gradient(135deg,#1d4ed8,#1e40af);}
.btn-red{background:linear-gradient(135deg,#dc2626,#b91c1c);}
.btn-orange{background:linear-gradient(135deg,#ea580c,#c2410c);}
.btn-teal{background:linear-gradient(135deg,#0d9488,#0f766e);}
.btn-purple{background:linear-gradient(135deg,#7c3aed,#6d28d9);}
.btn-yellow{background:linear-gradient(135deg,#d97706,#b45309);color:#fff;}
.btn-gray{background:linear-gradient(135deg,#475569,#334155);}
.btn-sm{padding:6px 10px;font-size:12px;}
.archive-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
.arch-item{display:flex;align-items:center;gap:6px;background:var(--primary);color:white;padding:7px 12px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700;border:1px solid transparent;transition:all .2s;}
.arch-item:hover{background:var(--primary-light);transform:translateY(-1px);}
.arch-item .arch-date{font-size:10px;color:rgba(255,255,255,.6);display:block;}
.arch-del{background:rgba(255,255,255,.2);border:none;color:white;width:18px;height:18px;border-radius:50%;cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .2s;}
.arch-del:hover{background:rgba(220,38,38,.8);}
.entry-section{background:var(--surface);border-radius:var(--radius);padding:20px 16px 14px;margin-bottom:14px;border:1px solid var(--border);box-shadow:var(--shadow);}
.entry-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:14px;margin-bottom:12px;}
.field{position:relative;}
.field label{position:absolute;top:-10px;right:10px;background:var(--surface);padding:0 6px;font-size:12px;font-weight:700;color:var(--primary);white-space:nowrap;}
.field input{width:100%;padding:12px 8px;border-radius:8px;border:2px solid var(--border);background:var(--input-bg);color:var(--text);text-align:center;font-size:16px;font-weight:900;outline:none;transition:border-color .2s;}
.field input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(30,64,175,.15);}
.field input[readonly]{background:var(--surface2);color:var(--text-muted);cursor:default;}
.entry-btns{display:flex;gap:8px;flex-wrap:wrap;}
.table-section{background:var(--surface);border-radius:var(--radius);margin-bottom:14px;border:1px solid var(--border);box-shadow:var(--shadow);overflow:hidden;}
.table-toolbar{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;border-bottom:1px solid var(--border);background:var(--surface2);}
.table-title{font-size:16px;font-weight:900;color:var(--text);}
.table-filter{padding:8px 12px;border-radius:8px;border:2px solid var(--border);background:var(--input-bg);color:var(--text);font-size:13px;outline:none;width:min(200px,100%);}
.table-filter:focus{border-color:var(--primary);}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
table{width:100%;border-collapse:collapse;min-width:580px;}
th{background:var(--th-bg);color:var(--text);padding:clamp(8px,1.5vw,14px) clamp(4px,1vw,8px);font-size:clamp(13px,1.8vw,16px);font-weight:900;border-bottom:2px solid var(--border);white-space:nowrap;position:sticky;top:0;z-index:10;}
td{padding:clamp(8px,1.5vw,12px) clamp(4px,1vw,8px);text-align:center;font-size:clamp(14px,1.8vw,16px);font-weight:700;border-bottom:1px solid var(--border);color:var(--text);}
tbody tr:hover{background:var(--hover-row)!important;}
tbody tr.marked{background:var(--mark-bg)!important;}
.num-cell{background:var(--surface2);color:var(--text-muted);font-size:13px;font-weight:900;}
.cell-edit{outline:none;min-width:40px;}
.row-actions{display:flex;gap:4px;justify-content:center;}
.row-btn{background:none;border:none;cursor:pointer;padding:4px 6px;border-radius:6px;font-size:14px;transition:background .2s;}
.row-btn:hover{background:var(--surface2);}
.total-row td{background:var(--total-bg)!important;color:var(--total-text)!important;font-size:clamp(14px,2vw,17px);font-weight:900;border-top:3px solid var(--accent);}
.hidden-row{display:none;}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:14px;}
.stat-card{background:var(--stat-bg);border-radius:var(--radius);padding:16px;text-align:center;border:1px solid var(--border);}
.stat-num{font-size:clamp(22px,4vw,32px);font-weight:900;color:var(--primary);}
[data-theme="dark"] .stat-num{color:var(--accent);}
.stat-label{font-size:12px;color:var(--text-muted);font-weight:700;margin-top:4px;}
.grand-section{background:var(--grand-bg);border-radius:var(--radius);padding:20px;margin-bottom:14px;border:2px solid var(--accent);}
.grand-title{text-align:center;font-size:18px;font-weight:900;color:var(--accent);margin-bottom:16px;border-bottom:2px solid var(--border);padding-bottom:10px;}
.grand-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;}
.grand-box{text-align:center;}
.grand-box label{display:block;font-size:12px;font-weight:700;color:var(--text-muted);margin-bottom:6px;}
.grand-box .grand-val{width:100%;padding:12px;text-align:center;font-weight:900;font-size:clamp(18px,3vw,22px);border:2px solid var(--border);border-radius:8px;background:var(--surface);color:var(--danger);display:block;}
.action-bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;justify-content:center;}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:10000;justify-content:center;align-items:center;backdrop-filter:blur(4px);}
.modal-overlay.show{display:flex;}
.modal{background:var(--modal-bg);padding:30px;border-radius:20px;text-align:center;width:min(400px,92vw);max-height:90vh;overflow-y:auto;border:2px solid var(--primary);box-shadow:0 20px 60px rgba(0,0,0,.4);animation:slideUp .25s ease;}
@keyframes slideUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
.modal h3{margin-bottom:18px;color:var(--primary);font-size:18px;font-weight:900;}
.modal-btns{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
.modal-input{width:100%;padding:12px;border-radius:10px;border:2px solid var(--border);background:var(--input-bg);color:var(--text);font-size:15px;font-weight:700;outline:none;text-align:center;margin-bottom:10px;}
.modal-input:focus{border-color:var(--primary);}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1e293b;color:white;padding:12px 24px;border-radius:30px;font-weight:700;z-index:20000;opacity:0;transition:opacity .3s;box-shadow:0 8px 24px rgba(0,0,0,.3);pointer-events:none;white-space:nowrap;border:1px solid rgba(255,255,255,.1);}
#toast.show{opacity:1;}
@media print{
  body{background:white!important;color:black!important;}
  .no-print{display:none!important;}
  .app-header{display:none!important;}
  .table-section{box-shadow:none!important;border:2px solid #000!important;}
  table{min-width:unset!important;}
  th{background:#e2e8f0!important;color:#000!important;}
  td{color:#000!important;}
  .total-row td{background:#1e293b!important;color:#fbbf24!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .print-header{display:block!important;}
}
.print-header{display:none;text-align:center;margin-bottom:20px;border-bottom:3px solid #1e40af;padding-bottom:15px;}
.print-header h1{font-size:24px;color:#1e40af;font-weight:900;}
.print-header p{font-size:14px;color:#475569;}
@media(max-width:640px){.header-btns .hbtn span{display:none;}.hbtn{padding:7px 9px;}.entry-grid{grid-template-columns:repeat(3,1fr);}.action-bar .btn span{display:none;}.action-bar .btn{padding:10px;}}
@media(max-width:400px){.entry-grid{grid-template-columns:repeat(2,1fr);}}
.divider{border:none;border-top:1px solid var(--border);margin:12px 0;}
.badge{display:inline-block;background:var(--danger);color:white;font-size:10px;font-weight:900;padding:1px 6px;border-radius:20px;margin-right:4px;vertical-align:middle;}

/* ===== VIEW MODES ===== */
/* Mode bar */
.view-mode-bar{background:var(--surface);border-radius:var(--radius);padding:10px 14px;margin-bottom:14px;border:1px solid var(--border);box-shadow:var(--shadow);display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.view-mode-bar .mode-label{font-weight:900;font-size:13px;color:var(--text-muted);margin-left:4px;}
.mode-btn{padding:7px 14px;border-radius:8px;border:2px solid var(--border);background:var(--surface2);color:var(--text);cursor:pointer;font-size:13px;font-weight:700;transition:all .2s;}
.mode-btn.active{background:var(--primary);color:white;border-color:var(--primary);}
.mode-btn:hover:not(.active){background:var(--hover-row);}

/* Table block separator */
.table-block{margin-bottom:0;}
.table-block-sep{height:28px;display:flex;align-items:center;justify-content:center;position:relative;margin:0;}
.table-block-sep::before{content:'';position:absolute;left:10%;right:10%;top:50%;height:2px;background:linear-gradient(90deg,transparent,var(--border),transparent);}
.table-block-sep-label{background:var(--bg);padding:0 14px;font-size:12px;color:var(--text-muted);font-weight:700;position:relative;z-index:1;}

/* Focus mode nav bar */
.focus-nav{background:var(--header-bg);color:var(--header-text);padding:10px 16px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;border-radius:var(--radius);margin-bottom:14px;box-shadow:var(--shadow);}
.focus-nav .fnav-label{font-size:13px;font-weight:900;color:var(--accent);margin-left:6px;}
.focus-nav-btn{padding:5px 12px;border-radius:6px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:white;cursor:pointer;font-size:12px;font-weight:700;transition:all .2s;}
.focus-nav-btn.active{background:var(--accent);color:#000;border-color:var(--accent);}
.focus-nav-btn:hover:not(.active){background:rgba(255,255,255,.2);}

/* Review mode extra styles */
body.mode-review tbody tr{border-bottom:3px solid var(--border) !important;}
body.mode-review tbody tr:nth-child(odd){background:var(--surface2) !important;}
body.mode-review tbody tr:nth-child(even){background:var(--surface) !important;}
body.mode-review tbody tr.marked{background:var(--mark-bg) !important;}
body.mode-review tbody tr:hover{background:var(--hover-row) !important;}
body.mode-review td{border-left:1px solid var(--border);padding-top:11px;padding-bottom:11px;}
body.mode-review th{border-left:1px solid var(--border);}

/* Add table btn */
.add-table-bar{display:flex;justify-content:center;padding:20px 0 10px;}
</style>
</head>
<body>

<!-- LOGIN PAGE -->
<div id="login-page">
  <div class="stars" id="stars"></div>
  <div class="login-card">
    <div class="profile-ring">
      <img id="profile-photo" src="icon.jpg" alt="الكابتن سعيد"/>
    </div>
    <div class="app-title">منظومة الكابتن سعيد</div>
    <div class="app-sub">إدارة الحركات المالية</div>
    <div class="clock-row">
      <div class="analog-clock" style="width:120px;height:120px;border-width:5px;margin:0;box-shadow:0 0 20px rgba(251,191,36,.3);">
        <div class="clock-num n12" style="font-size:10px;top:5px;">12</div>

}

function getSett(){try{return JSON.parse(localStorage.getItem(STORE_SETTINGS))||{};}catch{return {};}}
function getMultipliers(){
  const s=getSett();
  return {
    mult_a:   s.mult_a   !== undefined ? s.mult_a   : 100,
    mult_s:   s.mult_s   !== undefined ? s.mult_s   : 5,
    mult_p:   s.mult_p   !== undefined ? s.mult_p   : 15,
    mult_old: s.mult_old !== undefined ? s.mult_old : 5,
    mult_dis: s.mult_dis !== undefined ? s.mult_dis : 5,
    mech_val: s.mech_val !== undefined ? s.mech_val : 35,
  };
}
function newRowsArray(){return Array.from({length:ROWS_PER_TABLE},()=>({count:'',a:0,s:0,p:0,old:0,dis:0,m:0,marked:false}));}
function newTable(num){
  return {name:'تصاريح العمل - جدول رقم '+num, rows:newRowsArray()};
}
function load(k){try{return JSON.parse(localStorage.getItem(k));}catch{return null;}}
function save(k,v){localStorage.setItem(k,JSON.stringify(v));}
function saveTables(){save(STORE_TABLES,tablesData);}

// Global row number offset for table t index
function tableStartRow(tIdx){return tIdx*ROWS_PER_TABLE+1;}

// DESKTOP MODE
// ============================

// ============================
// CLOCK & STARS
// ============================
function genStars(){
  const c=document.getElementById('stars');
  for(let i=0;i<80;i++){
    const s=document.createElement('div');s.className='star';
    s.style.cssText='left:'+Math.random()*100+'%;top:'+Math.random()*100+'%;width:'+(Math.random()*3+1)+'px;height:'+(Math.random()*3+1)+'px;animation-delay:'+Math.random()*3+'s;animation-duration:'+(2+Math.random()*3)+'s;';
    c.appendChild(s);
  }
}
function updateClock(){
  const n=new Date();
  const se=n.getSeconds()*6,m=n.getMinutes()*6+(n.getSeconds()*.1),h=(n.getHours()%12)*30+(n.getMinutes()*.5);
  document.getElementById('s-hand').style.transform='rotate('+se+'deg)';
  document.getElementById('m-hand').style.transform='rotate('+m+'deg)';
  document.getElementById('h-hand').style.transform='rotate('+h+'deg)';
  const pad=x=>String(x).padStart(2,'0');
  document.getElementById('digital-time').textContent=pad(n.getHours())+':'+pad(n.getMinutes())+':'+pad(n.getSeconds());
}
genStars();setInterval(updateClock,1000);updateClock();

// ============================
// THEME
// ============================
const themeNames={light:'فاتح ☀️',dark:'داكن 🌙',ocean:'أزرق المحيط 🌊',forest:'أخضر الغابة 🌿',warm:'دافئ 🌅'};
(function initTheme(){
  const t=localStorage.getItem(STORE_THEME)||'dark';
  setTheme(t,false);
})();
function setTheme(t,toast=true){
  document.documentElement.setAttribute('data-theme',t);
  localStorage.setItem(STORE_THEME,t);
  if(toast) showToast('🎨 '+themeNames[t]);
}
function cycleTheme(){
  const cur=document.documentElement.getAttribute('data-theme')||'dark';
  const idx=THEMES.indexOf(cur);
  const next=THEMES[(idx+1)%THEMES.length];
  setTheme(next);
}

// ============================
// LOGIN / LOGOUT
// ============================
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    if(document.getElementById('login-page').style.display!=='none') login();
    else saveToTable();
  }
});
function login(){
  const v=document.getElementById('passInput').value;
  const err=document.getElementById('login-err');
  const correct=localStorage.getItem(STORE_PASS)||'123';
  if(v===correct){
    document.getElementById('login-page').style.display='none';
    document.getElementById('main-app').style.display='block';
    drawAll();renderArchive();updateGrand();
    err.textContent='';
  } else {
    err.textContent='❌ كلمة المرور غلط، حاول تاني!';
    document.getElementById('passInput').value='';
    document.getElementById('passInput').focus();
  }
}
function logout(){
  document.getElementById('main-app').style.display='none';
  document.getElementById('login-page').style.display='flex';
  document.getElementById('passInput').value='';
  document.getElementById('passInput').focus();
}

// ============================
// FORM
// ============================
function autoCalc(v){
  if(!v){['f_a','f_s','f_p','f_old','f_dis'].forEach(id=>document.getElementById(id).value='');return;}
  const n=parseFloat(v)||0;
  const m=getMultipliers();
  document.getElementById('f_a').value=n*m.mult_a;
  document.getElementById('f_s').value=n*m.mult_s;
  document.getElementById('f_p').value=n*m.mult_p;
  document.getElementById('f_old').value=n*m.mult_old;
  document.getElementById('f_dis').value=n*m.mult_dis;
}
function clearForm(){
  ['f_count','f_a','f_s','f_p','f_old','f_dis'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('f_m').value=getMultipliers().mech_val;
  document.getElementById('f_count').focus();
}
function getFormVals(){
  const m=getMultipliers();
  return {
    count:document.getElementById('f_count').value||'',
    a:+document.getElementById('f_a').value||0,
    s:+document.getElementById('f_s').value||0,
    p:+document.getElementById('f_p').value||0,
    old:+document.getElementById('f_old').value||0,
    dis:+document.getElementById('f_dis').value||0,
    m:m.mech_val,
    marked:false
  };
}
function saveToTable(){
  const v=document.getElementById('f_count').value;
  if(!v){showToast('⚠️ ادخل عدد الحركات أولاً');return;}
  // Find first empty row across all tables, in current focus table first if focus mode
  let targetTIdx=-1,targetRowIdx=-1;
  const searchOrder=viewMode==='focus'
    ? [focusTableIdx,...tablesData.map((_,i)=>i).filter(i=>i!==focusTableIdx)]
    : tablesData.map((_,i)=>i);
  for(const ti of searchOrder){
    const ri=tablesData[ti].rows.findIndex(r=>r.count===''||r.count===null||r.count===undefined);
    if(ri!==-1){targetTIdx=ti;targetRowIdx=ri;break;}
  }
  if(targetTIdx===-1){showToast('⚠️ كل الجداول ممتلئة! احفظ الملف أولاً');return;}
  tablesData[targetTIdx].rows[targetRowIdx]=getFormVals();
  drawAll();clearForm();
  const el=document.getElementById('row-'+targetTIdx+'-'+targetRowIdx);
  if(el) el.scrollIntoView({behavior:'smooth',block:'center'});
  showToast('✅ تمت الإضافة في جدول '+(targetTIdx+1));
}

// ============================
// VIEW MODE
// ============================
function setViewMode(mode){
  viewMode=mode;
  ['scroll','focus','review'].forEach(m=>{
    document.getElementById('mode'+m.charAt(0).toUpperCase()+m.slice(1)).classList.toggle('active',m===mode);
  });
  document.body.classList.toggle('mode-review',mode==='review');
  document.getElementById('focusNav').style.display=mode==='focus'?'flex':'none';
  drawAll();
}

// ============================
// ADD TABLE
// ============================
function addTable(){
  const num=tablesData.length+1;
  tablesData.push(newTable(num));
  saveTables();
  drawAll();
  // Scroll to new table
  setTimeout(()=>{
    const el=document.getElementById('table-block-'+( tablesData.length-1));
    if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
  },100);
  showToast('✅ تم إضافة جدول رقم '+num);
}

// ============================
// DRAW ALL TABLES
// ============================
function drawAll(){
  const container=document.getElementById('tablesContainer');
  container.innerHTML='';
  // Build focus nav
  const focusNavBtns=document.getElementById('focusNavBtns');
  focusNavBtns.innerHTML='';
  tablesData.forEach((t,tIdx)=>{
    const btn=document.createElement('button');
    btn.className='focus-nav-btn'+(tIdx===focusTableIdx?' active':'');
    btn.textContent='جدول '+(tIdx+1);
    btn.onclick=()=>{focusTableIdx=tIdx;drawAll();};
    focusNavBtns.appendChild(btn);
  });

  tablesData.forEach((tableObj,tIdx)=>{
    if(viewMode==='focus'&&tIdx!==focusTableIdx) return;

    // Separator between tables in scroll/review mode
    if(tIdx>0&&viewMode!=='focus'){
      const sep=document.createElement('div');
      sep.className='table-block-sep';
      sep.innerHTML='<span class="table-block-sep-label">↕ فاصل بين الجداول</span>';
      container.appendChild(sep);
    }

    const startRow=tableStartRow(tIdx);
    const block=document.createElement('div');
    block.className='table-section table-block';
    block.id='table-block-'+tIdx;

    // Toolbar
    const toolbar=document.createElement('div');
    toolbar.className='table-toolbar no-print';
    toolbar.innerHTML=`
      <div class="table-title">
        📋 ${tableObj.name}
        <span class="badge" id="rowCount-${tIdx}">0</span>
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
        <input class="table-filter" type="text" id="tableFilter-${tIdx}" placeholder="🔍 فلتر..." oninput="filterTableSingle(${tIdx})"/>
        <button class="btn btn-sm btn-blue no-print" onclick="document.getElementById('importExcel-${tIdx}').click()" title="استيراد Excel">📂 Excel</button>
        <input type="file" id="importExcel-${tIdx}" accept=".xlsx,.xls" style="display:none" onchange="importFromExcel(event,${tIdx})"/>
        <button class="btn btn-sm btn-red no-print" onclick="confirmDeleteTable(${tIdx})" title="حذف الجدول" ${tablesData.length===1?'disabled style="opacity:.4"':''}>🗑️ حذف</button>
      </div>`;
    block.appendChild(toolbar);

    // Table
    const wrap=document.createElement('div');
    wrap.className='table-wrap';
    const tbl=document.createElement('table');
    tbl.id='mainTable-'+tIdx;
    tbl.innerHTML=`<thead><tr>
      <th style="width:42px">م</th>
      <th>عدد الحركات</th><th>أمانات</th><th>ط.شهيد</th><th>ط.شرطة</th><th>مسنين</th><th>إعاقة</th><th>ميكنة</th>
      <th class="no-print" style="width:70px">خيارات</th>
    </tr></thead>`;
    const tbody=document.createElement('tbody');
    tbody.id='fixedBody-'+tIdx;

    const filter=(document.getElementById('tableFilter-'+tIdx)||{value:''}).value||'';
    tableObj.rows.forEach((row,i)=>{
      const globalNum=startRow+i;
      const hidden=filter&&!String(row.count).includes(filter)?'hidden-row':'';
      const marked=row.marked?'marked':'';
      const tr=document.createElement('tr');
      tr.id='row-'+tIdx+'-'+i;
      tr.className=hidden+' '+marked;
      tr.innerHTML=`<td class="num-cell">${globalNum}</td>
        <td contenteditable="true" class="cell-edit" onblur="updateCell(${tIdx},${i},'count',this.innerText)">${row.count||''}</td>
        <td contenteditable="true" class="cell-edit" onblur="updateCell(${tIdx},${i},'a',this.innerText)">${row.a||''}</td>
        <td contenteditable="true" class="cell-edit" onblur="updateCell(${tIdx},${i},'s',this.innerText)">${row.s||''}</td>
        <td contenteditable="true" class="cell-edit" onblur="updateCell(${tIdx},${i},'p',this.innerText)">${row.p||''}</td>
        <td contenteditable="true" class="cell-edit" onblur="updateCell(${tIdx},${i},'old',this.innerText)">${row.old||''}</td>
        <td contenteditable="true" class="cell-edit" onblur="updateCell(${tIdx},${i},'dis',this.innerText)">${row.dis||''}</td>
        <td contenteditable="true" class="cell-edit" onblur="updateCell(${tIdx},${i},'m',this.innerText)">${row.m||''}</td>
        <td class="no-print"><div class="row-actions"><button class="row-btn" onclick="openRowModal(${tIdx},${i})" title="خيارات الصف">⋮</button></div></td>`;
      tbody.appendChild(tr);
    });

    // Total row
    const t=calcTable(tableObj.rows);
    const tfoot=document.createElement('tfoot');
    tfoot.innerHTML=`<tr class="total-row">
      <td colspan="2">إجمالي جدول ${tIdx+1}</td>
      <td id="sum_a-${tIdx}">${t.a}</td><td id="sum_s-${tIdx}">${t.s}</td><td id="sum_p-${tIdx}">${t.p}</td>
      <td id="sum_old-${tIdx}">${t.old}</td><td id="sum_dis-${tIdx}">${t.dis}</td><td id="sum_m-${tIdx}">${t.m}</td>
      <td class="no-print"></td>
    </tr>`;

    tbl.appendChild(tbody);
    tbl.appendChild(tfoot);
    wrap.appendChild(tbl);
    block.appendChild(wrap);
    container.appendChild(block);

    // Update badge
    const filled=tableObj.rows.filter(r=>r.count!==''&&r.count!=null&&r.count!==undefined).length;
    const badge=document.getElementById('rowCount-'+tIdx);
    if(badge) badge.textContent=filled;
  });

  saveTables();
  updateAllStats();
  document.getElementById('f_m').value=getMultipliers().mech_val;
}

function calcTable(rows){
  return rows.reduce((acc,c)=>{
    acc.a+=+(c.a||0);acc.s+=+(c.s||0);acc.p+=+(c.p||0);
    acc.old+=+(c.old||0);acc.dis+=+(c.dis||0);acc.m+=+(c.m||0);
    return acc;
  },{a:0,s:0,p:0,old:0,dis:0,m:0});
}

function updateCell(tIdx,rowIdx,field,val){
  tablesData[tIdx].rows[rowIdx][field]=field==='count'?val:Number(val)||0;
  const t=calcTable(tablesData[tIdx].rows);
  ['a','s','p','old','dis','m'].forEach(k=>{
    const el=document.getElementById('sum_'+k+'-'+tIdx);
    if(el) el.textContent=t[k];
  });
  saveTables();
}

function updateAllStats(){
  if(!showStats) return;
  const totalFilled=tablesData.reduce((s,t)=>s+t.rows.filter(r=>r.count!==''&&r.count!=null).length,0);
  const totalCapacity=tablesData.length*ROWS_PER_TABLE;
  const totals=tablesData.reduce((acc,t)=>{
    const c=calcTable(t.rows);
    acc.a+=c.a;acc.s+=c.s;acc.p+=c.p;acc.old+=c.old;acc.dis+=c.dis;acc.m+=c.m;
    return acc;
  },{a:0,s:0,p:0,old:0,dis:0,m:0});
  const s=document.getElementById('stats-section');if(!s) return;
  s.innerHTML='<div class="stat-card"><div class="stat-num">'+totalFilled+'</div><div class="stat-label">صفوف مملوءة</div></div>'+
    '<div class="stat-card"><div class="stat-num">'+(totalCapacity-totalFilled)+'</div><div class="stat-label">صفوف فارغة</div></div>'+
    '<div class="stat-card"><div class="stat-num">'+tablesData.length+'</div><div class="stat-label">عدد الجداول</div></div>'+
    '<div class="stat-card"><div class="stat-num">'+Object.keys(archive).length+'</div><div class="stat-label">ملفات محفوظة</div></div>'+
    '<div class="stat-card"><div class="stat-num">'+totals.a+'</div><div class="stat-label">إجمالي الأمانات</div></div>'+
    '<div class="stat-card"><div class="stat-num">'+totals.s+'</div><div class="stat-label">إجمالي ط.شهيد</div></div>'+
    '<div class="stat-card"><div class="stat-num">'+totals.p+'</div><div class="stat-label">إجمالي ط.شرطة</div></div>';
}

function exportStyledExcel(){
  if(!window.XLSX){showToast('⚠️ مكتبة Excel غير محملة');return;}
  const wb=XLSX.utils.book_new();
  tablesData.forEach((tableObj,tIdx)=>{
    const cols=['م','عدد الحركات','أمانات','ط.شهيد','ط.شرطة','مسنين','إعاقة','ميكنة'];
    const data=[cols];
    const startRow=tableStartRow(tIdx);
    tableObj.rows.forEach((r,i)=>{if(r.count!==''&&r.count!=null) data.push([startRow+i,r.count,r.a,r.s,r.p,r.old,r.dis,r.m]);});
    const t=calcTable(tableObj.rows);
    data.push(['الإجمالي','',t.a,t.s,t.p,t.old,t.dis,t.m]);
    const ws=XLSX.utils.aoa_to_sheet(data);
    ws['!cols']=[{wch:5},{wch:15},{wch:10},{wch:10},{wch:10},{wch:10},{wch:10},{wch:10}];
    XLSX.utils.book_append_sheet(wb,ws,'جدول '+(tIdx+1));
  });
  XLSX.writeFile(wb,'الكابتن_سعيد_'+new Date().toLocaleDateString('ar-EG').replace(/\//g,'-')+'.xlsx');
  showToast('✅ تم تصدير ملف Excel');
}
function exportSingleArchiveExcel(key){
  if(!window.XLSX) return;
  const item=archive[key];
  const wb=XLSX.utils.book_new();
  const tables=item.tables||[{name:'جدول 1',rows:item.rows||item}];
  tables.forEach((tableObj,tIdx)=>{
    const cols=['م','عدد الحركات','أمانات','ط.شهيد','ط.شرطة','مسنين','إعاقة','ميكنة'];
    const startRow=tIdx*ROWS_PER_TABLE+1;
    const data=[['ملف: '+key+' | التاريخ: '+(item.date||'')],[],cols];
    tableObj.rows.forEach((r,i)=>{if(r.count!==''&&r.count!=null) data.push([startRow+i,r.count,r.a,r.s,r.p,r.old,r.dis,r.m]);});
    const t=calcTable(tableObj.rows);
    data.push(['الإجمالي','',t.a,t.s,t.p,t.old,t.dis,t.m]);
    const ws=XLSX.utils.aoa_to_sheet(data);
    ws['!cols']=[{wch:5},{wch:15},{wch:10},{wch:10},{wch:10},{wch:10},{wch:10},{wch:10}];
    ws['!merges']=[{s:{r:0,c:0},e:{r:0,c:7}}];
    XLSX.utils.book_append_sheet(wb,ws,(tableObj.name||'جدول '+(tIdx+1)).substring(0,30));
  });
  XLSX.writeFile(wb,key+'.xlsx');
  showToast('✅ تم تصدير ملف: '+key);
}

// ============================
// IMPORT EXCEL
// ============================
function importFromExcel(e,tIdx){
  const file=e.target.files[0];if(!file) return;
  const reader=new FileReader();
  reader.onload=function(ev){
    try{
      const wb=XLSX.read(ev.target.result,{type:'binary'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const data=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      let startRow=0;if(data[0]&&isNaN(data[0][0])) startRow=1;
      let idx=tablesData[tIdx].rows.findIndex(r=>r.count===''||r.count==null);
      const m=getMultipliers();
      for(let i=startRow;i<data.length;i++){
        if(idx>=ROWS_PER_TABLE) break;
        const row=data[i];const count=row[1]||row[0];if(!count) continue;
        tablesData[tIdx].rows[idx]={count:String(count),a:+row[2]||0,s:+row[3]||0,p:+row[4]||0,old:+row[5]||0,dis:+row[6]||0,m:m.mech_val,marked:false};
        idx++;
      }
      drawAll();showToast('✅ تم استيراد ملف Excel');
    } catch(err){showToast('❌ خطأ في قراءة الملف');}
  };
  reader.readAsBinaryString(file);e.target.value='';
}

async function exportPasswordPDF(){
  const pass=document.getElementById('pdfPassInput').value.trim();
  const prog=document.getElementById('pdf-progress');
  if(!pass){prog.textContent='⚠️ أدخل كلمة السر أولاً';prog.style.color='var(--danger)';return;}
  if(!window.PDFLib){prog.textContent='⚠️ مكتبة PDF غير محملة، جرب لاحقاً';prog.style.color='var(--danger)';return;}
  prog.textContent='⏳ جاري إنشاء ملف PDF...';prog.style.color='var(--text-muted)';
  try{
    const {PDFDocument,rgb,StandardFonts}=PDFLib;
    const pdfDoc=await PDFDocument.create();
    const font=await pdfDoc.embedFont(StandardFonts.Helvetica);
    const fontBold=await pdfDoc.embedFont(StandardFonts.HelveticaBold);
    const cols=['#','Count','Amanat','T.Shahid','T.Shorta','Musinin','Aaqa','Mech'];
    const colW=[30,70,65,65,65,65,65,65];
    for(let tIdx=0;tIdx<tablesData.length;tIdx++){
      const tableObj=tablesData[tIdx];
      let page=pdfDoc.addPage([595,842]);
      const {width,height}=page.getSize();
      page.drawText('Captain Said System - Table '+(tIdx+1),{x:width/2-100,y:height-50,size:16,font:fontBold,color:rgb(0.12,0.25,0.69)});
      page.drawText('Date: '+new Date().toLocaleDateString('en-GB'),{x:width/2-50,y:height-75,size:11,font,color:rgb(0.28,0.35,0.45)});
      let xOff=30,yOff=height-110;
      page.drawRectangle({x:25,y:yOff-5,width:width-50,height:22,color:rgb(0.88,0.91,0.94)});
      cols.forEach((c,i)=>{page.drawText(c,{x:xOff+2,y:yOff+3,size:9,font:fontBold,color:rgb(0.1,0.1,0.1)});xOff+=colW[i];});
      yOff-=18;
      const startRow=tableStartRow(tIdx);
      const filled=tableObj.rows.filter(r=>r.count!==''&&r.count!=null);
      filled.forEach((r,ri)=>{
        if(yOff<60){page=pdfDoc.addPage([595,842]);yOff=height-60;}
        if(ri%2===0) page.drawRectangle({x:25,y:yOff-4,width:width-50,height:18,color:rgb(0.97,0.98,1)});
        const vals=[startRow+ri,r.count,r.a,r.s,r.p,r.old,r.dis,r.m];
        xOff=30;
        vals.forEach((v,i)=>{page.drawText(String(v||''),{x:xOff+2,y:yOff,size:9,font,color:rgb(0.1,0.1,0.1)});xOff+=colW[i];});
        yOff-=16;
      });
      yOff-=8;
      const t=calcTable(tableObj.rows);
      page.drawRectangle({x:25,y:yOff-4,width:width-50,height:18,color:rgb(0.12,0.18,0.24)});
      const totVals=['Total','',t.a,t.s,t.p,t.old,t.dis,t.m];
      xOff=30;
      totVals.forEach((v,i)=>{page.drawText(String(v),{x:xOff+2,y:yOff,size:9,font:fontBold,color:rgb(0.98,0.75,0.14)});xOff+=colW[i];});
    }
    const pdfBytes=await pdfDoc.save({
      userPassword:pass,ownerPassword:pass+'_admin',
      permissions:{printing:'lowResolution',copying:false,modifying:false}
    });
    const blob=new Blob([pdfBytes],{type:'application/pdf'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download='الكابتن_سعيد_'+new Date().toLocaleDateString('ar-EG').replace(/\//g,'-')+'.pdf';
    a.click();URL.revokeObjectURL(url);
    prog.textContent='✅ تم تصدير PDF محمي بنجاح!';prog.style.color='var(--success)';
    setTimeout(()=>{closeModal('pdfPassModal');showToast('✅ تم تصدير PDF محمي بكلمة سر');},1500);
  } catch(err){
    prog.textContent='❌ خطأ: '+err.message;prog.style.color='var(--danger)';
  }
}

function toggleFullscreen(){
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen().then(()=>{document.getElementById('fsBtn').innerHTML='✕ <span>خروج</span>';showToast('⛶ ملء الشاشة مفعّل');}).catch(()=>{});
  } else {
    document.exitFullscreen().then(()=>{document.getElementById('fsBtn').innerHTML='⛶ <span>ملء</span>';showToast('نافذة عادية');});
  }
}

// ============================
// SHARE
// ============================
function shareData(){
  const totals=tablesData.reduce((acc,t)=>{const c=calcTable(t.rows);acc.a+=c.a;acc.s+=c.s;acc.p+=c.p;acc.old+=c.old;acc.dis+=c.dis;acc.m+=c.m;return acc;},{a:0,s:0,p:0,old:0,dis:0,m:0});
  const totalFilled=tablesData.reduce((s,t)=>s+t.rows.filter(r=>r.count!==''&&r.count!=null).length,0);
  const text='📋 منظومة الكابتن سعيد\n📅 '+new Date().toLocaleDateString('ar-EG')+'\nعدد الجداول: '+tablesData.length+'\nعدد الصفوف: '+totalFilled+'\nالأمانات: '+totals.a+'\nط.شهيد: '+totals.s+'\nط.شرطة: '+totals.p+'\nمسنين: '+totals.old+'\nإعاقة: '+totals.dis+'\nميكنة: '+totals.m;
  if(navigator.share){navigator.share({title:'منظومة الكابتن سعيد',text}).catch(()=>{});}
  else if(navigator.clipboard){navigator.clipboard.writeText(text).then(()=>showToast('✅ تم نسخ البيانات'));}
  else showToast('⚠️ المشاركة غير مدعومة في هذا المتصفح');
}

// ============================
// BACKUP
// ============================
function exportBackup(){
  const data=JSON.stringify({tables:tablesData,archive,exported:new Date().toISOString()},null,2);
  const blob=new Blob([data],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='نسخة_احتياطية_'+new Date().toLocaleDateString('ar-EG').replace(/\//g,'-')+'.json';a.click();
  showToast('✅ تم تصدير النسخة الاحتياطية');
}
function importBackup(e){
  const file=e.target.files[0];if(!file) return;
  const reader=new FileReader();
  reader.onload=function(ev){
    try{
      const data=JSON.parse(ev.target.result);
      showConfirm('سيتم استبدال كل البيانات الحالية بالنسخة الاحتياطية. متأكد؟',()=>{
        if(data.tables) tablesData=data.tables;
        else if(data.rows) tablesData=[{name:'تصاريح العمل - جدول رقم 1',rows:data.rows}];
        if(data.archive) archive=data.archive;
        saveTables();save(STORE_ARCH,archive);
        drawAll();renderArchive();updateGrand();
        showToast('✅ تم استيراد النسخة الاحتياطية بنجاح');
      });
    } catch{showToast('❌ ملف غير صالح');}
  };
  reader.readAsText(file);e.target.value='';
}

// ============================
// MODAL HELPERS
// ============================
function openModal(id){document.getElementById(id).classList.add('show');}
function closeModal(id){document.getElementById(id).classList.remove('show');}
document.querySelectorAll('.modal-overlay').forEach(el=>{
  el.addEventListener('click',function(e){if(e.target===this)this.classList.remove('show');});
});
let confirmCb=null;
function showConfirm(msg,cb){
  document.getElementById('confirmMsg').textContent=msg;
  confirmCb=cb;openModal('confirmModal');
}
document.getElementById('confirmOk').onclick=function(){
  closeModal('confirmModal');if(confirmCb)confirmCb();confirmCb=null;
};

// ============================
// TOAST
// ============================
let toastTimer;
function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),3000);
}

// ============================
// PWA
// ============================
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});
}

// ============================
// INIT
// ============================
drawAll();
</script>
